server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Media in this app is large (the hero videos are tens of megabytes), so
    # keep compression on for text and let the browser cache hashed assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app fallback. Without this, deep links produced by the
    # router — /plan/<session>/places, /trip/<session> — 404 on refresh
    # because no such file exists on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached, or clients pin to a stale bundle after a
    # deploy and request asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
