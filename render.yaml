# Render blueprint for the backend, Postgres and Redis.
#
# Vercel hosts the frontend; it cannot host this service — OR-Tools plus
# LangGraph and the provider SDKs exceed the serverless bundle limit, and the
# SSE itinerary stream needs a long-lived connection rather than a function
# invocation. Any container host works; this file just makes Render one click.
#
# Deploy:
#   1. Push this branch to GitHub.
#   2. Render dashboard -> New -> Blueprint -> pick the repo.
#   3. Fill in the secrets marked `sync: false` (they are deliberately not in
#      this file — it is committed).
#   4. Set CORS_ORIGINS to your Vercel URL once the frontend is deployed.
#
# Railway works from the same backend/Dockerfile if you prefer it; it just has
# no equivalent declarative file to commit.

databases:
  - name: travel-agent-db
    databaseName: travel_agent
    user: postgres
    plan: free

services:
  - type: redis
    name: travel-agent-cache
    plan: free
    # Reachable only from services in this Render account.
    ipAllowList: []

  - type: web
    name: travel-agent-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Free spins down after ~15 minutes idle; the next request pays a cold
    # start while this image loads OR-Tools and the LangGraph stack. Bump to
    # starter if the demo needs to answer immediately.
    plan: free
    region: oregon
    # /health calls Gemini and Google Maps on every request; polling it would
    # burn the free-tier quota. This one touches nothing.
    healthCheckPath: /api/v1/health/live
    envVars:
      # --- wired automatically from the managed services above ---
      - key: DATABASE_HOST
        fromDatabase:
          name: travel-agent-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: travel-agent-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: travel-agent-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: travel-agent-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: travel-agent-db
          property: password
      # One string rather than host/port: it carries the credentials, and the
      # cache falls back to localhost if this is missing.
      - key: REDIS_URL
        fromService:
          name: travel-agent-cache
          type: redis
          property: connectionString

      # --- runtime config ---
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      # Comma-separated. Set this to your Vercel domain, e.g.
      # https://travel-agent.vercel.app — a wrong value here shows up as CORS
      # failures in the browser, not as a server error.
      - key: CORS_ORIGINS
        sync: false

      # "google" needs billing enabled on the Google Cloud project; set this to
      # "foursquare" to run on the free-tier providers below instead.
      - key: MAPS_PROVIDER
        value: google

      # --- secrets: set in the Render dashboard, never committed ---
      # Required only when MAPS_PROVIDER=google.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Required only when MAPS_PROVIDER=foursquare.
      - key: FOURSQUARE_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      # searchapi.io, used for flight lookups.
      - key: SEARCH_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AMADEUS_API_KEY
        sync: false
      - key: AMADEUS_API_SECRET
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      # Generate a long random value. The app currently falls back to a
      # published placeholder if this is unset, which would let anyone mint
      # valid tokens.
      - key: JWT_SECRET_KEY
        generateValue: true
